# CI — required gates before any deploy workflow may proceed.
name: CI

on:
  push:
    branches: [master, main, staging]
  pull_request:
    branches: [master, main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Security · Types · Lint · Build · Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidvera_ci
          POSTGRES_PASSWORD: bidvera_ci
          POSTGRES_DB: bidvera_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidvera_ci -d bidvera_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable ephemeral CI DB only — never production / Neon / VPS credentials.
      DATABASE_URL: postgresql://bidvera_ci:bidvera_ci@127.0.0.1:5432/bidvera_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Migration safety scan
        run: npx tsx scripts/migration-safety-scan.ts

      - name: Prepare ephemeral CI database
        # Schema sync onto disposable empty Postgres (not production migrate path).
        # Historical migrations are not replayed here — CI DB is throwaway only.
        run: npx prisma db push

      - name: Security tests
        run: npm run test:security

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build-time public placeholders only — never real secrets
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: Bidvera-CI

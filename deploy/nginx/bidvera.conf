# Bidvera Nginx reverse proxy (TLS termination) — multi-instance production template
# Replace YOUR_DOMAIN with the public hostname (e.g. app.example.com).
#
# Certificates: obtain REAL Let's Encrypt certs — do not invent or self-sign for production:
#   sudo apt install certbot python3-certbot-nginx
#   sudo mkdir -p /var/www/certbot
#   # First enable the HTTP server below, then:
#   sudo certbot --nginx -d YOUR_DOMAIN
# Cert paths: /etc/letsencrypt/live/YOUR_DOMAIN/{fullchain,privkey}.pem
#
# App instances listen on loopback only (systemd HOSTNAME=127.0.0.1).
# Recommended production start: 3 upstreams (3000–3002) + deploy/systemd/bidvera-app@.service
# Single instance: keep only 127.0.0.1:3000 and comment the others.
# Add instance #4+: append server + enable bidvera-app@PORT — no application code change.
#
# Security headers remain controlled by Next.js — avoid conflicting Nginx add_header for CSP/HSTS.
#
# Liveness per instance: curl -sf http://127.0.0.1:3000/api/health
# Readiness (shared deps): curl -sf http://127.0.0.1:3000/api/ready
# Drain: comment/remove upstream line → nginx -t && reload → stop unit after in-flight drain.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bidvera_next {
    # least_conn spreads SSR CPU better than round-robin under uneven page costs
    # (measured bottleneck: Next.js SSR/RSC CPU, not Postgres connections).
    least_conn;
    # max_fails / fail_timeout: open-source Nginx passive health — skip a dead worker temporarily
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:3003 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:3004 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# HTTP → HTTPS redirect (+ ACME HTTP-01)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Enable after certificates exist (certbot may manage this block)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Align with Next proxyClientMaxBodySize (~110mb) + margin for multipart
    client_max_body_size 130m;

    # Safe text compression only (never invent binary gzip)
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Hashed Next build assets — long cache; still proxied so one upstream set serves all instances
    location /_next/static/ {
        proxy_pass http://bidvera_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://bidvera_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 300s: large package uploads + long SSR under concurrency (measured multi-second p95).
        # Do not lower without re-measuring upload + journey workloads.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        # Passive failover when one app instance is down (open-source Nginx; no active health module)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}
